<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Smart POS - Fine Dining Restaurant</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartPOS" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#121212] text-[#121212] antialiased select-none overflow-x-hidden font-['Inter',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isLocalDevelopment = ['localhost', '127.0.0.1'].includes(window.location.hostname);
          if (isLocalDevelopment) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              registrations.forEach((registration) => registration.unregister());
            });
            if ('caches' in window) {
              caches.keys().then((keys) => keys.filter((key) => key.startsWith('smart-pos-')).forEach((key) => caches.delete(key)));
            }
            return;
          }
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then((registration) => registration.update())
            .catch(err => console.log('SW Reg failed:', err));
        });
      }
    </script>
  </body>
</html>
